name: license_check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "staffly/pubspec.yaml"
      - ".github/workflows/license_check.yaml"
  push:
    branches:
      - main
    paths:
      - "staffly/pubspec.yaml"
      - ".github/workflows/license_check.yaml"

jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v2
    with:
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
      # vector_math (Zlib) ships as part of the Flutter SDK itself, and
      # pubspec_lock_parse (actually Apache-2.0, misreported as unknown by
      # pana's license detector) is a transitive dev dependency via bloc_lint.
      # Neither is a package we depend on directly, so they're skipped rather
      # than widening `allowed` for everything else.
      skip_packages: "vector_math,pubspec_lock_parse"
      flutter_version: "3.44.x"
      working_directory: staffly
