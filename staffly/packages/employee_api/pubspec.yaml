name: employee_api
description: >-
  Data layer for employee records — models and the SQLite-backed storage
  service.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  equatable: ^2.0.7
  # The pure-Dart half of sqflite. The Flutter plugin (package:sqflite) is
  # never imported here — the DatabaseFactory arrives through the constructor,
  # so this package stays runnable under plain `dart test`.
  sqflite_common: ^2.5.11

dev_dependencies:
  mocktail: ^1.0.5
  # Supplies databaseFactoryFfi, so tests exercise real SQLite in memory.
  sqflite_common_ffi: ^2.4.2
  test: ^1.31.1
  very_good_analysis: ^10.3.0
